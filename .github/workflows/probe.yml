# Временная проверка доступности сайта и VPN снаружи (с GitHub и из России через check-host.net)
name: Probe
on:
  push:
    branches: [claude/adoring-fermat-vlr60u]
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: From GitHub
        run: |
          set +e
          get() { curl -sS -o /dev/null -w "%{http_code} %{size_download}B %{time_total}s" --max-time 20 "$@" 2>&1 | tr '\n' ' '; echo; }
          for path in / /static/style.css /static/app.js /login; do
            for via in "144-31-61-111.sslip.io:8443:144.31.61.111|через RU-вход" "153-52-95-88.sslip.io:8443:153.52.95.88|напрямую на основной"; do
              r=${via%|*}; name=${via#*|}; host=${r%%:*}
              for proto in --http2 --http1.1; do
                for i in 1 2; do
                  echo "$path $name $proto #$i: $(get $proto --resolve "$r" "https://$host:8443$path")"
                done
              done
            done
          done
          echo "== 100 КБ+ через RU-вход, обычный HTTP на порт 80 (тот же путь RU → основной, без TLS)"
          get http://144-31-61-111.sslip.io/static/style.css
          get http://153-52-95-88.sslip.io/static/style.css
      - name: From Russia (check-host.net)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          H = {"Accept": "application/json", "User-Agent": "Mozilla/5.0"}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30))
          checks = [("http", "https://144-31-61-111.sslip.io:8443/static/style.css"),
                    ("http", "https://153-52-95-88.sslip.io:8443/static/style.css")]
          reqs = []
          for kind, host in checks:
              try:
                  r = get(f"https://check-host.net/check-{kind}?host={host}&max_nodes=100")
                  reqs.append((kind, host, r["request_id"], r["nodes"]))
              except Exception as e:
                  print(kind, host, "request failed:", e)
              time.sleep(6)
          time.sleep(30)
          for kind, host, rid, nodes in reqs:
              time.sleep(6)
              try:
                  res = get(f"https://check-host.net/check-result/{rid}")
              except Exception as e:
                  print(kind, host, "result failed:", e); continue
              print(f"\n=== {kind} {host}")
              for node, info in sorted(nodes.items(), key=lambda kv: (kv[1][0] != "ru", kv[0])):
                  cc, city = info[0], info[2]
                  if cc not in ("ru", "de", "nl", "fi", "us"):
                      continue
                  print(f"  {cc} {city:<16} {json.dumps(res.get(node), ensure_ascii=False)[:160]}")
          PY
